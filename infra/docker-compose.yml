version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devmesh_postgres
    restart: always
    environment:
      POSTGRES_DB: devmesh
      POSTGRES_USER: devmesh
      POSTGRES_PASSWORD: devmeshpassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmesh -d devmesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devmesh_redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: devmesh_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: devmesh_livekit
    restart: always
    command: --dev --bind 0.0.0.0
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: devmesh_api
    restart: always
    environment:
      PORT: 3001
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecretsecret
      LIVEKIT_URL: ws://livekit:7880
      DATABASE_URL: postgresql://devmesh:devmeshpassword@postgres:5432/devmesh
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  collab:
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    container_name: devmesh_collab
    restart: always
    environment:
      HOCUSPOCUS_PORT: 1234
      COLLAB_PERSISTENCE_DB: postgresql://devmesh:devmeshpassword@postgres:5432/devmesh
      REDIS_URL: redis://redis:6379
    ports:
      - '1234:1234'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    container_name: devmesh_client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - api
      - collab

volumes:
  postgres_data:
  minio_data:
